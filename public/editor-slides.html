<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — 슬라이드 편집</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='19' height='26' rx='3' fill='%231f4d47'/%3E%3Cpath d='M18 3v6a2 2 0 0 0 2 2h6z' fill='%234fd6c4'/%3E%3Crect x='9' y='16' width='11' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3Crect x='9' y='21' width='8' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="editor-body slides-editor-page">
  <script>
    // 다른 화면에 iframe으로 임베드할 때 툴바 없이 콘텐츠(그리드)만 보이게 하는 옵션.
    // 모듈 스크립트(editor-slides.bundle.js)가 뜨기 전에 툴바가 잠깐 보였다 사라지는 걸
    // 막기 위해 body 여는 태그 바로 뒤, 툴바가 파싱되기 전에 동기적으로 클래스를 붙인다.
    if (new URLSearchParams(location.search).get('chrome') === 'hidden') {
      document.body.classList.add('chrome-hidden');
    }
    // "문서 목록으로"(.doclist-link)만 숨긴다 (editor-grid.html과 동일 — 공용 webviewer를
    // 다른 서비스에 임베드할 때, 그 서비스 소유가 아닌 webviewer 자체 홈으로 못 나가게 함)
    if (new URLSearchParams(location.search).get('home') === 'hidden') {
      document.body.classList.add('home-hidden');
    }
  </script>
  <header class="editor-toolbar" id="toolbar">
    <div class="toolbar-top-row">
      <div class="toolbar-group toolbar-left">
        <a href="/" class="icon-btn doclist-link" title="문서 목록으로" aria-label="문서 목록으로 돌아가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <span id="doc-title" class="doc-title">문서 불러오는 중…</span>
        <span id="conn-status" class="conn-status" data-status="connecting">연결 중…</span>
        <span id="save-status" class="save-status" data-status="idle" hidden>
          <svg class="save-status-icon-saving" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/></svg>
          <svg class="save-status-icon-saved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <svg class="save-status-icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
          <span class="save-status-text"></span>
        </span>
      </div>
      <div class="toolbar-group toolbar-right">
        <div id="presence-list" class="presence-list" aria-label="현재 접속 중인 참여자"></div>
      </div>
    </div>
    <!-- 프레젠테이션 프로그램 "홈" 탭과 같은 사용 흐름의 리본 — 아이콘·라벨은 전부 자체 제작
         (상용 제품의 아이콘/이미지 자산은 쓰지 않는다). 그룹: 슬라이드 · 글꼴 · 단락 · 그리기. -->
    <div class="toolbar-group toolbar-format" id="slides-ribbon">
      <div class="ribbon-group" id="ribbon-slides">
        <div class="ribbon-group-buttons">
          <button id="btn-add-blank" class="icon-btn icon-btn-big" title="새 슬라이드 (Ctrl+M)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="15" height="11" rx="1.2"/><path d="M19 15v6M16 18h6"/></svg>
            <span>새 슬라이드</span>
          </button>
          <div class="ribbon-group-buttons-wrap">
            <div class="ribbon-row">
              <button id="btn-dup-slide" class="icon-btn ribbon-btn-labeled" title="슬라이드 복제 (Ctrl+D)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="10" rx="1.2"/><path d="M5 15V6a1 1 0 0 1 1-1h11"/></svg>
                <span class="ribbon-btn-label">복제</span>
              </button>
            </div>
            <div class="ribbon-row">
              <button id="btn-del-slide" class="icon-btn ribbon-btn-labeled" title="슬라이드 삭제">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4h6v3"/></svg>
                <span class="ribbon-btn-label">삭제</span>
              </button>
            </div>
          </div>
        </div>
        <span class="ribbon-group-label">슬라이드</span>
      </div>

      <div class="ribbon-group slides-text-group" id="format-toolbar" aria-label="텍스트 서식">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <select id="font-family" class="toolbar-select slides-font-family" title="글꼴" aria-label="글꼴">
              <option value="">테마 글꼴</option>
              <option value="맑은 고딕">맑은 고딕</option>
              <option value="나눔고딕">나눔고딕</option>
              <option value="굴림">굴림</option>
              <option value="돋움">돋움</option>
              <option value="바탕">바탕</option>
              <option value="궁서">궁서</option>
              <option value="Arial">Arial</option>
              <option value="Calibri">Calibri</option>
              <option value="Times New Roman">Times New Roman</option>
            </select>
            <select id="font-size" class="toolbar-select" title="글자 크기" aria-label="글자 크기">
              <option value="">크기</option>
              <option value="10">10</option><option value="12">12</option><option value="14">14</option>
              <option value="16">16</option><option value="18">18</option><option value="20">20</option>
              <option value="24">24</option><option value="28">28</option><option value="32">32</option>
              <option value="36">36</option><option value="40">40</option><option value="44">44</option>
              <option value="54">54</option><option value="60">60</option><option value="72">72</option>
            </select>
            <button id="btn-font-grow" class="icon-btn icon-btn-fontsize" title="글꼴 크기 크게 (Ctrl+Shift+>)">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▲</span>
            </button>
            <button id="btn-font-shrink" class="icon-btn icon-btn-fontsize" title="글꼴 크기 작게 (Ctrl+Shift+<)">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▼</span>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-bold" class="icon-btn icon-btn-glyph" title="굵게 (Ctrl+B)" aria-pressed="false"><strong>가</strong></button>
            <button id="btn-italic" class="icon-btn icon-btn-glyph" title="기울임꼴 (Ctrl+I)" aria-pressed="false"><em>가</em></button>
            <button id="btn-underline" class="icon-btn icon-btn-glyph" title="밑줄 (Ctrl+U)" aria-pressed="false"><u>가</u></button>
            <span class="color-btn" id="text-color-btn" title="글꼴 색">
              <span class="color-btn-glyph">가</span>
              <span class="color-btn-bar"></span>
              <input id="text-color-picker" class="color-btn-input" type="color" value="#c00000" title="글꼴 색" aria-label="글꼴 색" />
            </span>
            <button id="btn-clear-format" class="icon-btn" title="모든 서식 지우기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h12M12 5l-3 14"/><path d="m15 15 5 5M20 15l-5 5"/></svg>
            </button>
          </div>
        </div>
        <span class="ribbon-group-label">글꼴</span>
      </div>

      <div class="ribbon-group" id="ribbon-paragraph" aria-label="단락">
        <div class="ribbon-group-buttons">
          <button id="btn-align-left" class="icon-btn" title="왼쪽 맞춤 (Ctrl+L)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg>
          </button>
          <button id="btn-align-center" class="icon-btn" title="가운데 맞춤 (Ctrl+E)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg>
          </button>
          <button id="btn-align-right" class="icon-btn" title="오른쪽 맞춤 (Ctrl+R)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg>
          </button>
          <button id="btn-align-justify" class="icon-btn" title="양쪽 맞춤 (Ctrl+J)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
          </button>
        </div>
        <span class="ribbon-group-label">단락</span>
      </div>

      <div class="ribbon-group" id="ribbon-draw" aria-label="그리기">
        <div class="ribbon-group-buttons">
          <button id="btn-add-textbox" class="icon-btn icon-btn-big" title="텍스트 상자 삽입">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.2" stroke-dasharray="3 2"/><path d="M8 9h8M12 9v8"/></svg>
            <span>텍스트 상자</span>
          </button>
          <div class="ribbon-group-buttons-wrap">
            <div class="ribbon-row">
              <button id="btn-shape-rect" class="icon-btn" title="사각형 삽입">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12"/></svg>
              </button>
              <button id="btn-shape-roundrect" class="icon-btn" title="둥근 사각형 삽입">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="4"/></svg>
              </button>
              <button id="btn-shape-ellipse" class="icon-btn" title="타원 삽입">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
              </button>
            </div>
            <div class="ribbon-row">
              <span class="color-btn" id="shape-fill-btn" title="도형 채우기 색(새로 넣을 도형)">
                <span class="color-btn-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 11 6-6 7 7-6 6a2 2 0 0 1-2.8 0L5 13.8a2 2 0 0 1 0-2.8Z"/><path d="M19 15s2 2.2 2 3.5a2 2 0 0 1-4 0c0-1.3 2-3.5 2-3.5Z"/></svg></span>
                <span class="color-btn-bar"></span>
                <input id="shape-fill-picker" class="color-btn-input" type="color" value="#4472c4" title="도형 채우기 색" aria-label="도형 채우기 색" />
              </span>
            </div>
          </div>
        </div>
        <span class="ribbon-group-label">그리기</span>
      </div>
    </div>
  </header>

  <div class="slides-editor-body">
    <aside id="slides-rail" class="slides-rail" aria-label="슬라이드 목록"></aside>
    <main id="slide-canvas-wrap" class="slide-canvas-wrap">
      <div id="slide-canvas" class="slide-canvas" aria-label="선택한 슬라이드 콘텐츠"></div>
    </main>
  </div>

  <template id="slide-card-template">
    <div class="slide-card" draggable="true">
      <div class="slide-card-thumb">
        <img alt="" loading="lazy" />
        <span class="slide-card-number"></span>
      </div>
      <div class="slide-card-actions">
        <button class="icon-btn slide-card-duplicate" title="복사">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="1.3"/><path d="M15 8V5.5A1.5 1.5 0 0 0 13.5 4H5.5A1.5 1.5 0 0 0 4 5.5v11A1.5 1.5 0 0 0 5.5 18H8"/></svg>
        </button>
        <button class="icon-btn slide-card-delete" title="삭제">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
        </button>
      </div>
    </div>
  </template>

  <div id="error-screen" class="error-screen" hidden>
    <div class="error-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p id="error-message"></p>
      <a href="/" class="btn-pill btn-pill-primary doclist-link">문서 목록으로</a>
    </div>
  </div>

  <script type="module" src="/js/editor-slides.bundle.js"></script>
</body>
</html>
