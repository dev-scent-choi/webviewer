<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — 문서 관리</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Doc<span>View</span></h1>
    <p class="tagline">권한 제어형 문서 웹뷰어</p>
  </header>

  <main class="container">
    <section class="upload-panel" aria-labelledby="upload-heading">
      <h2 id="upload-heading">문서 업로드</h2>
      <label class="file-drop" for="file-input">
        <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg" />
        <span id="file-label">파일을 선택하면 바로 업로드되고 뷰어가 열립니다</span>
      </label>
      <p id="format-hint" class="format-hint"></p>
      <div id="progress" class="progress" hidden>
        <div class="progress-head">
          <span id="progress-label"></span>
          <span id="progress-percent"></span>
        </div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
      <p id="upload-status" class="status" role="status"></p>
    </section>

    <section aria-labelledby="docs-heading">
      <h2 id="docs-heading">문서 목록</h2>
      <ul id="doc-list" class="doc-list"></ul>
      <p id="empty-message" class="empty" hidden>아직 업로드된 문서가 없습니다.</p>
    </section>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
