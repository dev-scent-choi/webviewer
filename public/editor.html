<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — 동시편집</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='19' height='26' rx='3' fill='%231f4d47'/%3E%3Cpath d='M18 3v6a2 2 0 0 0 2 2h6z' fill='%234fd6c4'/%3E%3Crect x='9' y='16' width='11' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3Crect x='9' y='21' width='8' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="editor-body">
  <script>
    // 다른 화면에 iframe으로 임베드할 때 툴바 없이 콘텐츠만 보이게 하는 옵션 (editor-grid.html과 동일)
    if (new URLSearchParams(location.search).get('chrome') === 'hidden') {
      document.body.classList.add('chrome-hidden');
    }
    // "문서 목록으로"(.doclist-link)만 숨긴다 (editor-grid.html과 동일 — 공용 webviewer를
    // 다른 서비스에 임베드할 때, 그 서비스 소유가 아닌 webviewer 자체 홈으로 못 나가게 함)
    if (new URLSearchParams(location.search).get('home') === 'hidden') {
      document.body.classList.add('home-hidden');
    }
  </script>
  <header class="editor-toolbar office-shell" id="toolbar" data-app="word">
    <div class="office-titlebar">
      <div class="titlebar-left">
        <a href="/" class="icon-btn doclist-link" title="문서 목록으로" aria-label="문서 목록으로 돌아가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <div class="quick-access" role="toolbar" aria-label="빠른 실행 도구 모음">
          <button id="qa-save" class="qa-btn" title="저장 (Ctrl+S)" aria-label="저장">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
          </button>
          <button id="qa-undo" class="qa-btn" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
          </button>
          <button id="qa-redo" class="qa-btn" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
          </button>
        </div>
      </div>
      <div class="titlebar-center">
        <span id="doc-title" class="doc-title">문서 불러오는 중…</span>
        <span id="save-status" class="save-status" data-status="idle" hidden>
          <svg class="save-status-icon-saving" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/></svg>
          <svg class="save-status-icon-saved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <svg class="save-status-icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
          <span class="save-status-text"></span>
        </span>
      </div>
      <div class="titlebar-right">
        <span id="conn-status" class="conn-status" data-status="connecting">연결 중…</span>
        <span id="readonly-badge" class="readonly-badge" hidden>읽기 전용</span>
        <button id="search-btn" class="icon-btn" title="찾기 (Ctrl+F)" aria-label="찾기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <div id="presence-list" class="presence-list" aria-label="현재 접속 중인 참여자"></div>
      </div>
    </div>

    <div class="ribbon-tabs" role="tablist" aria-label="리본">
      <button class="ribbon-tab ribbon-tab-file" role="tab" data-tab="file">파일</button>
      <button class="ribbon-tab" role="tab" data-tab="home" data-edit-only>홈</button>
      <button class="ribbon-tab" role="tab" data-tab="insert" data-edit-only>삽입</button>
      <button class="ribbon-tab" role="tab" data-tab="layout" data-edit-only>레이아웃</button>
      <button class="ribbon-tab" role="tab" data-tab="review">검토</button>
      <button class="ribbon-tab" role="tab" data-tab="view">보기</button>
      <button class="ribbon-tab ribbon-tab-contextual" role="tab" data-tab="table" data-edit-only hidden>표 레이아웃</button>
      <span class="ribbon-tabs-spacer"></span>
      <button id="ribbon-collapse" class="ribbon-collapse" title="리본 축소 (Ctrl+F1)" aria-label="리본 축소">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
      </button>
    </div>

    <!-- ===== 홈 ===== -->
    <div class="toolbar-group toolbar-format ribbon-panel" data-panel="home" role="tabpanel">
      <div class="ribbon-group">
        <div class="ribbon-group-buttons">
          <button id="btn-paste" class="icon-btn icon-btn-big" title="붙여넣기 (Ctrl+V)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="4" rx="1"/><rect x="5" y="6" width="14" height="16" rx="1.5"/><path d="M9 12h6M9 16h6"/></svg>
            <span>붙여넣기</span>
          </button>
          <div class="ribbon-group-buttons-wrap">
            <div class="ribbon-row">
              <button id="btn-cut" class="icon-btn ribbon-btn-labeled" title="잘라내기 (Ctrl+X)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.5 8 20 20M8.5 16 20 4"/></svg>
                <span class="ribbon-btn-label">잘라내기</span>
              </button>
            </div>
            <div class="ribbon-row">
              <button id="btn-copy" class="icon-btn ribbon-btn-labeled" title="복사 (Ctrl+C)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="1.3"/><path d="M15 8V5.5A1.5 1.5 0 0 0 13.5 4H5.5A1.5 1.5 0 0 0 4 5.5v11A1.5 1.5 0 0 0 5.5 18H8"/></svg>
                <span class="ribbon-btn-label">복사</span>
              </button>
            </div>
            <div class="ribbon-row">
              <button id="btn-format-painter" class="icon-btn ribbon-btn-labeled" title="서식 복사 (두 번 누르면 계속 칠하기, Esc로 끝)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h9v5H9z"/><path d="M11 8v5H7a2 2 0 0 0-2 2v1"/><path d="m14 15 6 6"/><path d="M12.5 15.5a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L14 22l-4-4Z"/></svg>
                <span class="ribbon-btn-label">서식 복사</span>
              </button>
            </div>
          </div>
        </div>
        <span class="ribbon-group-label">클립보드</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <select id="font-family" class="toolbar-select toolbar-select-full" title="글꼴" aria-label="글꼴">
              <option value="">(문서 기본)</option>
              <option value="맑은 고딕">맑은 고딕</option>
              <option value="굴림">굴림</option>
              <option value="굴림체">굴림체</option>
              <option value="돋움">돋움</option>
              <option value="돋움체">돋움체</option>
              <option value="바탕">바탕</option>
              <option value="바탕체">바탕체</option>
              <option value="궁서">궁서</option>
              <option value="궁서체">궁서체</option>
              <option value="Arial">Arial</option>
              <option value="Calibri">Calibri</option>
              <option value="Cambria">Cambria</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Courier New">Courier New</option>
              <option value="Verdana">Verdana</option>
              <option value="Tahoma">Tahoma</option>
            </select>
            <select id="font-size" class="toolbar-select" title="글꼴 크기" aria-label="글꼴 크기">
              <option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="10.5">10.5</option>
              <option value="11">11</option><option value="12">12</option><option value="14">14</option><option value="16">16</option>
              <option value="18">18</option><option value="20">20</option><option value="22">22</option><option value="24">24</option>
              <option value="26">26</option><option value="28">28</option><option value="36">36</option><option value="48">48</option>
              <option value="72">72</option>
            </select>
            <button id="btn-font-grow" class="icon-btn icon-btn-fontsize" title="글꼴 크기 크게 (Ctrl+])">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▲</span>
            </button>
            <button id="btn-font-shrink" class="icon-btn icon-btn-fontsize" title="글꼴 크기 작게 (Ctrl+[)">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▼</span>
            </button>
            <span class="dropdown-btn" id="change-case-dropdown">
              <button class="icon-btn dropdown-caret dropdown-caret-labeled" title="대/소문자 바꾸기" aria-label="대/소문자 바꾸기">
                Aa
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="dropdown-menu" hidden>
                <button data-value="sentence">문장의 첫 글자를 대문자로</button>
                <button data-value="lower">모두 소문자로</button>
                <button data-value="upper">모두 대문자로</button>
                <button data-value="title">각 단어를 대문자로 시작</button>
                <button data-value="toggle">대/소문자 전환</button>
              </div>
            </span>
            <button id="btn-clear-format" class="icon-btn" title="모든 서식 지우기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-.94-.94-.94-2.46 0-3.4l9.6-9.6c.94-.94 2.46-.94 3.4 0l5.6 5.6c.94.94.94 2.46 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-bold" class="icon-btn icon-btn-glyph" title="굵게 (Ctrl+B)"><strong>가</strong></button>
            <button id="btn-italic" class="icon-btn icon-btn-glyph" title="기울임꼴 (Ctrl+I)"><em>가</em></button>
            <button id="btn-underline" class="icon-btn icon-btn-glyph" title="밑줄 (Ctrl+U)"><u>가</u></button>
            <button id="btn-strike" class="icon-btn icon-btn-glyph" title="취소선"><s>가</s></button>
            <button id="btn-subscript" class="icon-btn" title="아래 첨자 (Ctrl+=)">x<sub>2</sub></button>
            <button id="btn-superscript" class="icon-btn" title="위 첨자 (Ctrl+Shift++)">x<sup>2</sup></button>
            <span class="dropdown-btn color-dropdown-btn" id="highlight-dropdown">
              <button id="btn-highlight-apply" class="icon-btn color-apply-btn" title="텍스트 강조 색">
                <span class="color-btn-glyph">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
                </span>
                <span class="color-btn-bar" id="highlight-bar" style="background: #ffff00;"></span>
              </button>
              <button class="dropdown-caret" aria-label="텍스트 강조 색 선택">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="dropdown-menu" hidden></div>
            </span>
            <span class="dropdown-btn color-dropdown-btn" id="font-color-dropdown">
              <button id="btn-font-color-apply" class="icon-btn color-apply-btn" title="글꼴 색">
                <span class="color-btn-glyph">가</span>
                <span class="color-btn-bar" id="font-color-bar" style="background: #c00000;"></span>
              </button>
              <button class="dropdown-caret" aria-label="글꼴 색 선택">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="dropdown-menu" hidden></div>
            </span>
          </div>
        </div>
        <span class="ribbon-group-label">글꼴</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <button id="btn-bullet-list" class="icon-btn" title="글머리 기호">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>
            </button>
            <button id="btn-ordered-list" class="icon-btn" title="번호 매기기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 4.5h1.2V9M4 9h2.4"/><path d="M4 14.2c.4-.6 2.4-.8 2.4.5 0 1-2.4 1.6-2.4 3.3h2.5"/></svg>
            </button>
            <button id="btn-multilevel-list" class="icon-btn" title="다단계 목록">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M12 12h8M14 18h6"/><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="7.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
            </button>
            <button id="btn-outdent" class="icon-btn" title="내어쓰기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg>
            </button>
            <button id="btn-indent" class="icon-btn" title="들여쓰기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 4 4-4 4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-align-left" class="icon-btn" title="왼쪽 맞춤 (Ctrl+L)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
            </button>
            <button id="btn-align-center" class="icon-btn" title="가운데 맞춤 (Ctrl+E)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M8 12h8M6 18h12"/></svg>
            </button>
            <button id="btn-align-right" class="icon-btn" title="오른쪽 맞춤 (Ctrl+R)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 12h10M6 18h14"/></svg>
            </button>
            <button id="btn-align-justify" class="icon-btn" title="양쪽 맞춤 (Ctrl+J)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <span class="dropdown-btn" id="line-spacing-dropdown">
              <button class="icon-btn dropdown-caret dropdown-caret-labeled" title="줄 및 단락 간격" aria-label="줄 및 단락 간격">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4.5 6.5 7 4l2.5 2.5M4.5 17.5 7 20l2.5-2.5"/><path d="M13 6h7M13 12h7M13 18h7"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="dropdown-menu" hidden>
                <button data-value="1">1.0</button>
                <button data-value="1.15">1.15</button>
                <button data-value="1.5">1.5</button>
                <button data-value="2">2.0</button>
                <button data-value="2.5">2.5</button>
                <button data-value="3">3.0</button>
              </div>
            </span>
            <span class="dropdown-btn color-dropdown-btn" id="shading-dropdown">
              <button id="btn-shading-apply" class="icon-btn color-apply-btn" title="음영">
                <span class="color-btn-glyph">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.6 10.2a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8L5 8Z"/><path d="M8 8a4 4 0 0 1 8 0"/></svg>
                </span>
                <span class="color-btn-bar" id="shading-bar" style="background: #d9d9d9;"></span>
              </button>
              <button class="dropdown-caret" aria-label="음영 색 선택">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="dropdown-menu" hidden></div>
            </span>
          </div>
        </div>
        <span class="ribbon-group-label">단락</span>
      </div>

      <div class="ribbon-group">
        <div class="style-gallery">
          <button class="style-gallery-item" data-style="Normal" data-preview="normal" title="표준">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">표준</span>
          </button>
          <button class="style-gallery-item" data-style="NoSpacing" data-preview="spacingless" title="간격 없음">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">간격 없음</span>
          </button>
          <button class="style-gallery-item" data-style="Heading1" data-preview="h1" title="제목 1 (Ctrl+Alt+1)">
            <span class="style-gallery-preview">가나다</span>
            <span class="style-gallery-label">제목 1</span>
          </button>
          <button class="style-gallery-item" data-style="Heading2" data-preview="h2" title="제목 2 (Ctrl+Alt+2)">
            <span class="style-gallery-preview">가나다</span>
            <span class="style-gallery-label">제목 2</span>
          </button>
          <button class="style-gallery-item" data-style="Title" data-preview="title" title="제목">
            <span class="style-gallery-preview">가나다</span>
            <span class="style-gallery-label">제목</span>
          </button>
          <button class="style-gallery-item" data-style="Subtitle" data-preview="subtitle" title="부제">

      <button id="search-next" class="btn-mini" disabled>다음 찾기</button>
      <button id="search-replace-one" class="btn-mini" hidden>바꾸기</button>
      <button id="search-replace-all" class="btn-mini" hidden>모두 바꾸기</button>
      <button id="search-close" class="btn-mini">닫기</button>
    </div>
  </div>

  <div id="unsupported-warning" class="unsupported-warning" hidden>
    이 문서에는 이미지 등 편집기가 지원하지 않는 요소가 포함되어 있습니다 — 이 화면에서 저장하면
    해당 요소는 사라집니다. 원본을 보존하려면 편집 대신 뷰어에서 다운로드하세요.
  </div>

  <div id="editor-zoom-host">
    <main id="editor" class="editor-surface"></main>
  </div>

  <aside id="review-pane" class="review-pane" hidden aria-labelledby="review-pane-title">
    <header class="review-pane-head">
      <h2 id="review-pane-title">메모</h2>
      <button id="review-pane-refresh" class="icon-btn" title="새로 고침" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button id="review-pane-close" class="icon-btn" title="닫기" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>
    <div id="review-pane-body" class="review-pane-body"></div>
  </aside>

  <div id="word-count-dialog" class="office-dialog" hidden role="dialog" aria-labelledby="word-count-title">
    <div class="office-dialog-card">
      <h2 id="word-count-title">단어 개수</h2>
      <p id="word-count-scope" class="office-dialog-sub"></p>
      <dl id="word-count-stats" class="office-dialog-stats"></dl>
      <div class="office-dialog-actions"><button id="word-count-close" class="btn-mini">닫기</button></div>
    </div>
  </div>

  <footer class="office-statusbar" id="statusbar">
    <span id="status-words" class="statusbar-item">단어 0개</span>
    <span id="status-chars" class="statusbar-item">문자 0개</span>
    <span class="statusbar-spacer"></span>
    <div class="zoom-group" role="group" aria-label="확대/축소">
      <button id="zoom-out" class="zoom-btn" title="축소" aria-label="축소">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <div class="zoom-slider-track" id="zoom-slider-track">
        <div class="zoom-slider-fill" id="zoom-slider-fill"></div>
        <div class="zoom-slider-handle" id="zoom-slider-handle"></div>
      </div>
      <button id="zoom-in" class="zoom-btn" title="확대" aria-label="확대">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
      <span class="zoom-sep"></span>
      <span id="zoom-level" class="zoom-level">100%</span>
    </div>
  </footer>

  <div id="doc-watermark" class="doc-watermark-overlay" aria-hidden="true"></div>

  <div id="error-screen" class="error-screen" hidden>
    <div class="error-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p id="error-message"></p>
      <a href="/" class="btn-pill btn-pill-primary doclist-link">문서 목록으로</a>
    </div>
  </div>

  <script type="module" src="/js/editor.bundle.js"></script>
</body>
</html>
