<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — PDF 편집</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='19' height='26' rx='3' fill='%23c4302b'/%3E%3Cpath d='M18 3v6a2 2 0 0 0 2 2h6z' fill='%23f6a7a3'/%3E%3Crect x='9' y='16' width='11' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3Crect x='9' y='21' width='8' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/pdf-editor.css" />
</head>
<body class="editor-body pdf-editor-page">
  <script>
    // editor-slides.html과 같은 임베드 옵션 — home=hidden: webviewer 자체 홈 링크 숨김, back=parent: ← 를 "그 서비스로 돌아가기"로
    if (new URLSearchParams(location.search).get('home') === 'hidden') {
      document.body.classList.add('home-hidden');
    }
    if (new URLSearchParams(location.search).get('back') === 'parent' && window.parent !== window) {
      document.body.classList.remove('home-hidden');
      document.addEventListener('click', function (event) {
        var link = event.target && event.target.closest && event.target.closest('.doclist-link');
        if (!link) return;
        event.preventDefault();
        event.stopPropagation();
        window.parent.postMessage({ type: 'docview:back' }, '*');
      }, true);
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.doclist-link').forEach(function (link) {
          link.title = '다른 파일 열기';
          link.setAttribute('aria-label', '다른 파일 열기');
        });
      });
    }
  </script>

  <!-- 제목 줄: ← · 문서 탭 · 연결 상태 · 참여자 -->
  <header class="pdf-titlebar">
    <a href="/" class="pdf-icon-btn doclist-link" title="문서 목록으로" aria-label="문서 목록으로 돌아가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <div class="pdf-doc-tab" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>
      <span id="doc-name">PDF</span>
      <span id="save-dot" class="pdf-save-dot" title="저장됨" hidden></span>
    </div>
    <span class="pdf-spacer"></span>
    <span id="conn-status" class="pdf-conn" data-state="connecting">연결 중</span>
    <div id="presence" class="presence-list pdf-presence" aria-label="함께 보는 사람"></div>
  </header>

  <!-- 위 줄: 메뉴 · 모드 탭 · 찾기 · 정보/내려받기/인쇄 -->
  <nav class="pdf-topbar" aria-label="PDF 도구">
    <button id="menu-btn" class="pdf-menu-btn" type="button" aria-pressed="true" title="도구 목록 열기/닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15"/></svg>
      <span>메뉴</span>
    </button>
    <div class="pdf-modes" role="tablist">
      <button class="pdf-mode" role="tab" data-mode="tools" aria-selected="true">모든 도구</button>
      <button class="pdf-mode" role="tab" data-mode="read" aria-selected="false">읽기</button>
      <button class="pdf-mode" role="tab" data-mode="edit" aria-selected="false" data-edit-only>편집</button>
      <button class="pdf-mode" role="tab" data-mode="sign" aria-selected="false" data-edit-only>서명</button>
    </div>
    <span class="pdf-spacer"></span>
    <label class="pdf-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="top-find" type="search" placeholder="문서에서 찾기" autocomplete="off" aria-label="문서에서 찾기" />
      <kbd>Ctrl+F</kbd>
    </label>
    <button id="info-btn" class="pdf-icon-btn" type="button" title="문서 정보" aria-label="문서 정보">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
    <button id="download-btn" class="pdf-icon-btn" type="button" title="내려받기" aria-label="내려받기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
    </button>
    <button id="print-btn" class="pdf-icon-btn" type="button" title="인쇄 (Ctrl+P)" aria-label="인쇄">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
    </button>
  </nav>

  <div class="pdf-main">
    <!-- 왼쪽: 모든 도구 -->
    <aside id="tools-panel" class="pdf-tools-panel" aria-label="모든 도구">
      <div class="pdf-panel-head">
        <h2>모든 도구</h2>
        <button id="tools-close" class="pdf-icon-btn pdf-panel-close" type="button" title="닫기" aria-label="도구 목록 닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <ul class="pdf-tool-list">
        <li><button class="pdf-tool-item" data-tool="comment" style="--tc:#e6a817"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span>주석 달기</span></button></li>
        <li><button class="pdf-tool-item" data-tool="organize" style="--tc:#2e9b5f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg><span>페이지 정리</span></button></li>
        <li><button class="pdf-tool-item" data-tool="combine" style="--tc:#3a6fd8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8 4h7l3 3v10H8z"/><path d="M5 7v13h10"/></svg><span>파일 합치기</span></button></li>
        <li><button class="pdf-tool-item" data-tool="extract" style="--tc:#7a52c7"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 14h6M12 11v6"/></svg><span>페이지 추출·나누기</span></button></li>
        <li><button class="pdf-tool-item" data-tool="fill" style="--tc:#c4302b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg><span>양식 채우기·서명</span></button></li>
        <li><button class="pdf-tool-item" data-tool="download" style="--tc:#3a6fd8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>내려받기</span></button></li>
      </ul>
    </aside>

    <!-- 가운데: 쪽들 -->
    <section class="pdf-stage">
      <div class="pdf-floating-tools" role="toolbar" aria-label="보기 도구">
        <button id="tool-select" class="pdf-float-btn" type="button" aria-pressed="true" title="선택 (V)" aria-label="선택">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l13 8-6 1.5L9 19z"/></svg>
        </button>
        <button id="tool-hand" class="pdf-float-btn" type="button" aria-pressed="false" title="손 — 끌어서 이동 (H)" aria-label="손">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V12M14 11.5V6a1.5 1.5 0 0 1 3 0v8c0 4-2.5 7-6 7-2.5 0-4-1.3-5.5-3.5L3.8 14a1.5 1.5 0 0 1 2.4-1.8L8 14"/></svg>
        </button>
        <div id="annot-tools" class="pdf-annot-tools" hidden>
          <span class="pdf-float-sep"></span>
          <button class="pdf-float-btn" type="button" data-tool="note" aria-pressed="false" title="메모 — 누른 곳에 메모 (N)" aria-label="메모">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
          </button>
          <span class="pdf-float-group" data-group="markup">
            <button class="pdf-float-btn" type="button" data-tool="highlight" aria-pressed="false" title="형광펜 — 글자를 끌어 고르기 (U)" aria-label="형광펜">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 15 6.5-6.5a1.8 1.8 0 0 0-2.5-2.5L6.5 12.5 6 15z"/><path d="M3 20h18" stroke-width="3" stroke="#f2c200"/></svg>
            </button>
            <button class="pdf-float-more" type="button" aria-label="형광펜 종류" title="형광펜·밑줄·취소선"></button>
            <span class="pdf-float-menu" hidden>
              <button type="button" data-pick="highlight" title="형광펜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 20h18" stroke-width="3" stroke="#f2c200"/><path d="M7 15h10"/></svg><span>형광펜</span></button>
              <button type="button" data-pick="underline" title="밑줄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 4v7a5 5 0 0 0 10 0V4"/><path d="M5 20h14" stroke="#1a73e8" stroke-width="2.2"/></svg><span>밑줄</span></button>
              <button type="button" data-pick="strike" title="취소선"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M16 6c-1-1.3-2.5-2-4.3-2C9 4 7.5 5.5 7.5 7.3 7.5 11 16.5 10 16.5 15c0 2.2-2 4-4.7 4-2 0-3.7-.9-4.8-2.4"/><path d="M4 12h16" stroke="#d93025" stroke-width="2.2"/></svg><span>취소선</span></button>
            </span>
          </span>
          <button class="pdf-float-btn" type="button" data-tool="ink" aria-pressed="false" title="펜 — 자유롭게 그리기 (P)" aria-label="펜">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
          </button>
          <button class="pdf-float-btn" type="button" data-tool="freetext" aria-pressed="false" title="글상자 — 눌러서 글 넣기 (T)" aria-label="글상자">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" stroke-dasharray="3 2"/><path d="M8 9h8M12 9v7"/></svg>
          </button>
          <span class="pdf-float-group" data-group="shape">
            <button class="pdf-float-btn" type="button" data-tool="rect" aria-pressed="false" title="사각형 (R)" aria-label="도형">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>
            </button>
            <button class="pdf-float-more" type="button" aria-label="도형 종류" title="사각형·타원·선·화살표"></button>
            <span class="pdf-float-menu" hidden>
              <button type="button" data-pick="rect" title="사각형"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="14" rx="1"/></svg><span>사각형</span></button>
              <button type="button" data-pick="ellipse" title="타원"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg><span>타원</span></button>
              <button type="button" data-pick="line" title="선"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19 19 5"/></svg><span>선</span></button>
              <button type="button" data-pick="arrow" title="화살표"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M10 5h9v9"/></svg><span>화살표</span></button>
            </span>
          </span>
          <button class="pdf-float-btn" type="button" data-tool="eraser" aria-pressed="false" title="지우개 — 누른 주석 지우기 (E)" aria-label="지우개">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a2 2 0 0 1 0-2.8l9.6-9.6a2 2 0 0 1 2.8 0l5.6 5.6a2 2 0 0 1 0 2.8L13 21"/><path d="M22 21H7M5 11l9 9"/></svg>
          </button>
          <span class="pdf-float-sep"></span>
          <button class="pdf-float-btn" type="button" data-tool="textedit" aria-pressed="false" title="글자 고치기 — 본문 글을 눌러 바로 고치기" aria-label="글자 고치기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h12v2M10 5v14M7 19h6"/><path d="m15 15 4-4 2 2-4 4h-2z"/></svg>
          </button>
          <button class="pdf-float-btn" type="button" data-tool="redact" aria-pressed="false" title="가리기 — 끌어서 영역 표시, ‘가리기 적용’으로 내용을 지움" aria-label="가리기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><rect x="6.5" y="9" width="11" height="6" fill="currentColor"/></svg>
          </button>
          <button id="redact-apply" class="pdf-redact-apply" type="button" hidden title="표시한 영역의 내용을 지웁니다">적용 <em id="redact-count">0</em></button>
          <span class="pdf-float-sep"></span>
          <button id="annot-style-btn" class="pdf-float-btn" type="button" title="색·굵기·투명도" aria-label="색·굵기·투명도"><span class="pdf-style-dot"></span></button>
          <button id="annot-undo" class="pdf-float-btn" type="button" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
          </button>
          <button id="annot-redo" class="pdf-float-btn" type="button" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
          </button>
        </div>
        <!-- 서명 탭 도구(signUi.ts) -->
        <div id="sign-tools" class="pdf-annot-tools pdf-sign-tools" hidden>
          <span class="pdf-float-sep"></span>
          <button id="sign-new" class="pdf-float-btn" type="button" title="서명 만들기 — 그리기·그림·글자" aria-label="서명 만들기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c2-1 3.5-5 5-5s1 4 3 4 3-6 5-6 1.5 4 5 4"/><path d="M3 21h18"/></svg>
          </button>
          <div id="sign-list" class="pdf-sign-list" aria-label="내 서명"></div>
          <span class="pdf-float-sep"></span>
          <button id="sign-date" class="pdf-float-btn" type="button" aria-pressed="false" title="날짜 — 누른 곳에 오늘 날짜" aria-label="날짜">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
          </button>
          <span class="pdf-float-group" data-group="seal">
            <button id="sign-seal" class="pdf-float-btn" type="button" aria-pressed="false" title="글자 도장" aria-label="글자 도장">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M8 12h8" stroke-linecap="round"/></svg>
            </button>
            <button class="pdf-float-more" type="button" aria-label="도장 글자 고르기" title="도장 글자"></button>
            <span class="pdf-float-menu" hidden>
              <button type="button" data-seal="승인"><span>승인</span></button>
              <button type="button" data-seal="검토"><span>검토</span></button>
              <button type="button" data-seal="확인"><span>확인</span></button>
              <button type="button" data-seal="반려"><span>반려</span></button>
              <button type="button" data-seal=""><span>직접 입력…</span></button>
            </span>
          </span>
          <span class="pdf-float-sep"></span>
          <button id="sign-fields" class="pdf-float-btn" type="button" title="양식 칸 목록" aria-label="양식 칸 목록">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="13" width="16" height="5" rx="1"/><path d="M7 6.5h5M7 15.5h3"/></svg>
          </button>
        </div>
      </div>
      <div id="annot-style" class="pdf-style-pop" hidden>
        <div class="pdf-style-row pdf-style-colors"></div>
        <label class="pdf-style-row"><span>사용자 색</span><input id="annot-color" type="color" value="#d93025" /></label>
        <label class="pdf-style-row" data-for="width"><span>굵기</span><input id="annot-width" type="range" min="0.5" max="12" step="0.5" value="2" /><em id="annot-width-val">2pt</em></label>
        <label class="pdf-style-row" data-for="fontsize" hidden><span>글자 크기</span><input id="annot-fontsize" type="range" min="6" max="48" step="1" value="14" /><em id="annot-fontsize-val">14pt</em></label>
        <label class="pdf-style-row"><span>투명도</span><input id="annot-opacity" type="range" min="10" max="100" step="5" value="100" /><em id="annot-opacity-val">100%</em></label>
      </div>
      <div id="find-bar" class="pdf-find-bar" hidden role="search">
        <input id="find-input" type="search" placeholder="찾을 내용" autocomplete="off" aria-label="찾을 내용" />
        <span id="find-count" class="pdf-find-count"></span>
        <button id="find-prev" class="pdf-icon-btn" type="button" title="이전 (Shift+Enter)" aria-label="이전 결과"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg></button>
        <button id="find-next" class="pdf-icon-btn" type="button" title="다음 (Enter)" aria-label="다음 결과"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="find-close" class="pdf-icon-btn" type="button" title="닫기 (Esc)" aria-label="찾기 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="mode-notice" class="pdf-mode-notice" hidden></div>
      <div id="pdf-scroll" class="pdf-scroll" tabindex="0">
        <div id="pdf-pages" class="pdf-pages"></div>
      </div>
      <div id="pdf-loading" class="pdf-loading"><span class="pdf-spinner"></span><span>PDF를 여는 중…</span></div>

      <!-- 페이지 정리 화면(organizeView.ts) -->
      <div id="organize" class="pdf-organize" hidden>
        <div class="pdf-org-bar" role="toolbar" aria-label="페이지 정리 도구">
          <strong class="pdf-org-title">페이지 정리</strong>
          <span id="org-status" class="pdf-org-status"></span>
          <span class="pdf-org-sep"></span>
          <button id="org-rotate-left" class="pdf-org-btn" type="button" data-edit-only data-needs-selection title="왼쪽으로 돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M5.5 15a7 7 0 1 0 1.6-7.3L4 10"/></svg><span>왼쪽으로</span></button>
          <button id="org-rotate-right" class="pdf-org-btn" type="button" data-edit-only data-needs-selection title="오른쪽으로 돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v6h-6"/><path d="M18.5 15a7 7 0 1 1-1.6-7.3L20 10"/></svg><span>오른쪽으로</span></button>
          <button id="org-delete" class="pdf-org-btn" type="button" data-edit-only data-needs-selection title="고른 쪽 지우기 (Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span>지우기</span></button>
          <button id="org-move-up" class="pdf-org-btn" type="button" data-edit-only data-needs-selection title="앞으로 옮기기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg><span>앞으로</span></button>
          <button id="org-move-down" class="pdf-org-btn" type="button" data-edit-only data-needs-selection title="뒤로 옮기기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg><span>뒤로</span></button>
          <span class="pdf-org-sep" data-edit-only></span>
          <button id="org-blank" class="pdf-org-btn" type="button" data-edit-only title="빈 쪽 넣기(고른 쪽 뒤, 없으면 끝)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v6M9 13h6" stroke-linecap="round"/></svg><span>빈 쪽</span></button>
          <button id="org-insert-file" class="pdf-org-btn" type="button" data-edit-only title="다른 PDF의 쪽 넣기(고른 쪽 뒤, 없으면 끝)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 4h7l3 3v10H8z"/><path d="M5 7v13h10"/></svg><span>파일에서 넣기</span></button>
          <span class="pdf-org-sep" data-download-only></span>
          <button id="org-extract" class="pdf-org-btn" type="button" data-download-only data-needs-selection title="고른 쪽만 새 PDF로 내려받기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v7M9 14l3 3 3-3"/></svg><span>고른 쪽 추출</span></button>
          <div class="pdf-org-split-wrap" data-download-only>
            <button id="org-split-btn" class="pdf-org-btn" type="button" title="여러 PDF로 나누어 내려받기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16"/><path d="M7 4h10v5H7zM7 15h10v5H7z" stroke-linejoin="round"/></svg><span>나누기</span></button>
            <div id="org-split" class="pdf-org-split" hidden>
              <label><input id="org-split-every" type="radio" name="org-split-mode" checked /> <input id="org-split-n" type="number" min="1" value="1" aria-label="몇 쪽씩" />쪽씩</label>
              <label><input id="org-split-at" type="radio" name="org-split-mode" /> 고른 쪽 앞에서 자르기</label>
              <button id="org-split-go" class="pdf-org-primary" type="button">나누어 내려받기</button>
            </div>
          </div>
          <span class="pdf-org-grow"></span>
          <button id="org-undo" class="pdf-icon-btn" type="button" data-edit-only title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
          <button id="org-redo" class="pdf-icon-btn" type="button" data-edit-only title="다시 실행 (Ctrl+Y)" aria-label="다시 실행"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
          <button id="org-close" class="pdf-org-primary" type="button" title="닫기 (Esc)">닫기</button>
        </div>
        <div id="org-grid" class="pdf-org-grid" tabindex="-1" aria-label="쪽 목록" aria-multiselectable="true"></div>
        <input id="org-file" type="file" accept="application/pdf,.pdf" multiple hidden />
      </div>
    </section>

    <!-- 오른쪽: 정보 창(페이지·책갈피·레이어) -->
    <aside id="inspector" class="pdf-inspector" aria-label="정보 창">
      <section id="panel-thumbs" class="pdf-panel" data-panel="thumbs">
        <div class="pdf-panel-head"><h2>페이지</h2><button class="pdf-icon-btn pdf-panel-close" type="button" data-close-panel title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div id="thumbs" class="pdf-thumbs"></div>
      </section>
      <section id="panel-outline" class="pdf-panel" data-panel="outline" hidden>
        <div class="pdf-panel-head"><h2>책갈피</h2><button class="pdf-icon-btn pdf-panel-close" type="button" data-close-panel title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div id="outline" class="pdf-outline"></div>
      </section>
      <section id="panel-comments" class="pdf-panel" data-panel="comments" hidden>
        <div class="pdf-panel-head"><h2>메모 <span id="comments-count" class="pdf-count"></span></h2><button class="pdf-icon-btn pdf-panel-close" type="button" data-close-panel title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div id="comments" class="pdf-comments"></div>
      </section>
      <section id="panel-fields" class="pdf-panel" data-panel="fields" hidden>
        <div class="pdf-panel-head"><h2>양식 칸 <em id="fields-count"></em></h2><button class="pdf-icon-btn pdf-panel-close" type="button" data-close-panel title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div id="fields" class="pdf-fields"></div>
      </section>
      <section id="panel-layers" class="pdf-panel" data-panel="layers" hidden>
        <div class="pdf-panel-head"><h2>레이어</h2><button class="pdf-icon-btn pdf-panel-close" type="button" data-close-panel title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div id="layers" class="pdf-layers"></div>
      </section>
    </aside>

    <!-- 맨 오른쪽 줄 -->
    <nav class="pdf-rail" aria-label="보기">
      <button id="rail-comments" class="pdf-rail-btn" type="button" data-panel="comments" aria-pressed="false" title="메모" aria-label="메모">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
      </button>
      <button id="rail-thumbs" class="pdf-rail-btn" type="button" data-panel="thumbs" aria-pressed="true" title="페이지" aria-label="페이지">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="3" width="10" height="13" rx="1"/><path d="M9 20h10V7"/></svg>
      </button>
      <button id="rail-outline" class="pdf-rail-btn" type="button" data-panel="outline" aria-pressed="false" title="책갈피" aria-label="책갈피">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 3h10v18l-5-4-5 4z"/></svg>
      </button>
      <button id="rail-fields" class="pdf-rail-btn" type="button" data-panel="fields" aria-pressed="false" title="양식 칸" aria-label="양식 칸">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="13" width="16" height="5" rx="1"/><path d="M7 6.5h5M7 15.5h3"/></svg>
      </button>
      <button id="rail-layers" class="pdf-rail-btn" type="button" data-panel="layers" aria-pressed="false" title="레이어" aria-label="레이어">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <span class="pdf-spacer"></span>
      <div class="pdf-page-box">
        <input id="page-input" type="text" inputmode="numeric" value="1" aria-label="쪽 번호" />
        <span id="page-count">/ 1</span>
      </div>
      <button id="page-prev" class="pdf-rail-btn" type="button" title="이전 쪽" aria-label="이전 쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg></button>
      <button id="page-next" class="pdf-rail-btn" type="button" title="다음 쪽" aria-label="다음 쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <span id="zoom-level" class="pdf-zoom-level">100%</span>
      <button id="fit-btn" class="pdf-rail-btn" type="button" title="폭에 맞춤 / 쪽에 맞춤 (Ctrl+0)" aria-label="맞춤"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="rotate-btn" class="pdf-rail-btn" type="button" title="보기 회전" aria-label="보기 회전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
      <button id="zoom-in" class="pdf-rail-btn" type="button" title="확대 (Ctrl+=)" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg></button>
      <button id="zoom-out" class="pdf-rail-btn" type="button" title="축소 (Ctrl+-)" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></svg></button>
    </nav>
  </div>

  <div id="info-dialog" class="office-dialog" hidden role="dialog" aria-labelledby="info-dialog-title">
    <div class="office-dialog-card">
      <h2 id="info-dialog-title">문서 정보</h2>
      <dl id="info-list" class="office-dialog-stats"></dl>
      <div class="office-dialog-actions"><button id="info-close" class="btn-mini">닫기</button></div>
    </div>
  </div>

  <div id="redact-dialog" class="office-dialog" hidden role="dialog" aria-labelledby="redact-dialog-title">
    <div class="office-dialog-card pdf-redact-card">
      <h2 id="redact-dialog-title">가리기 적용</h2>
      <p id="redact-dialog-text"></p>
      <p class="pdf-redact-warn">적용하면 그 영역의 글자·그림·링크가 저장 파일에서 <strong>지워지고 되돌릴 수 없습니다.</strong></p>
      <div class="office-dialog-actions">
        <button id="redact-cancel" class="btn-mini" type="button">취소</button>
        <button id="redact-confirm" class="btn-mini btn-mini-danger" type="button">가리기 적용</button>
      </div>
    </div>
  </div>

  <div id="sign-dialog" class="office-dialog" hidden role="dialog" aria-labelledby="sign-dialog-title">
    <div class="office-dialog-card pdf-sign-card">
      <h2 id="sign-dialog-title">서명 만들기</h2>
      <div class="pdf-sign-tabs" role="tablist">
        <button type="button" role="tab" data-sign-tab="draw" aria-selected="true">그리기</button>
        <button type="button" role="tab" data-sign-tab="image" aria-selected="false">그림 올리기</button>
        <button type="button" role="tab" data-sign-tab="type" aria-selected="false">글자로</button>
      </div>
      <div class="pdf-sign-pane" data-sign-pane="draw">
        <canvas id="sign-pad" class="pdf-sign-pad" width="960" height="320" aria-label="여기에 서명을 그리세요"></canvas>
        <div class="pdf-sign-row">
          <span class="pdf-sign-colors">
            <button type="button" data-ink="#1f1f23" aria-pressed="true" title="검정" style="--c:#1f1f23"></button>
            <button type="button" data-ink="#1a3fa8" aria-pressed="false" title="파랑" style="--c:#1a3fa8"></button>
            <button type="button" data-ink="#c62828" aria-pressed="false" title="빨강" style="--c:#c62828"></button>
          </span>
          <button id="sign-clear" class="btn-mini" type="button">지우기</button>
        </div>
      </div>
      <div class="pdf-sign-pane" data-sign-pane="image" hidden>
        <label class="pdf-sign-drop"><input id="sign-file" type="file" accept="image/png,image/jpeg" /><span>서명·도장 그림(PNG·JPG)을 고르세요</span></label>
        <img id="sign-preview" class="pdf-sign-preview" alt="고른 그림 미리 보기" hidden />
        <label class="pdf-sign-check"><input id="sign-whiten" type="checkbox" checked /> 흰 바탕을 투명하게</label>
      </div>
      <div class="pdf-sign-pane" data-sign-pane="type" hidden>
        <input id="sign-text" class="pdf-sign-text" type="text" maxlength="40" placeholder="이름을 입력하세요" />
        <div id="sign-styles" class="pdf-sign-styles"></div>
      </div>
      <p id="sign-error" class="pdf-sign-error" hidden></p>
      <div class="office-dialog-actions">
        <button id="sign-cancel" class="btn-mini" type="button">취소</button>
        <button id="sign-ok" class="btn-mini btn-mini-primary" type="button">만들고 놓기</button>
      </div>
    </div>
  </div>

  <div id="pdf-error" class="pdf-error" hidden></div>
  <script type="module" src="/js/editor-pdf.bundle.js"></script>
</body>
</html>
